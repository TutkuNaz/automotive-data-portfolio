name: Catalog CI

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1"
  push:
    paths:
      - "README.md"
      - "datasets/**"
      - "examples/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/catalog-ci.yml"
  pull_request:
    paths:
      - "README.md"
      - "datasets/**"
      - "examples/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/catalog-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run catalog tests
        run: python -m unittest discover -s tests -v
      - name: Verify generated JSON is current
        run: python scripts/export_catalog.py --check
      - name: Validate starter examples
        run: |
          python -m py_compile examples/*.py
          python -m json.tool examples/nhtsa_reliability_starter.ipynb > /dev/null
      - name: Smoke-test catalog search
        run: python scripts/search_catalog.py safety --format table

  links:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check source links
        run: python scripts/check_links.py --attempts 3 --workers 8
