name: Catalog CI

on:
  push:
    paths:
      - "datasets/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/catalog-ci.yml"
  pull_request:
    paths:
      - "datasets/**"
      - "scripts/**"
      - "tests/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run catalog tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test catalog search
        run: python scripts/search_catalog.py safety
